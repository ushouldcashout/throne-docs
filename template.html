<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · throne. docs</title>
<meta name="description" content="throne. docs: how the desk works, fees, margin, referrals, points, the court.">
<link rel="icon" type="image/webp" href="assets/favicon.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/docs.css">
</head>
<body>
<header class="top">
  <a class="brand" href="{{home}}"><img src="assets/crown.svg" alt="" width="22" height="22"><span>throne<b>.</b></span><em>docs</em></a>
  <button class="menu" id="menu" aria-label="menu">☰</button>
  <nav class="links">
    <a href="{{home}}">site</a>
    <a href="{{home}}/points">points</a>
    <a class="cta" href="{{desk}}">launch app →</a>
  </nav>
</header>
<div class="wrap">
  <aside class="side" id="side">
    {{nav}}
  </aside>
  <main class="doc">
    <article>
      {{body}}
    </article>
    <footer class="foot">
      <span>updated {{stamp}}</span>
      <span>in the seat · <a href="https://x.com/thronedefi" target="_blank" rel="noreferrer">join us on twitter</a></span>
    </footer>
  </main>
  <aside class="toc">{{toc}}</aside>
</div>
<script>
  document.getElementById('menu').onclick = () => document.getElementById('side').classList.toggle('open');
  document.querySelectorAll('.side a').forEach(a => a.addEventListener('click', () => document.getElementById('side').classList.remove('open')));
</script>
</body>
</html>
